worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined if=$safe_access_log;
    sendfile on;
    server_tokens off;
    keepalive_timeout 65;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    map $uri $safe_access_log {
        default 1;
        ~^/public/ 0;
    }
    map $host $local_host {
        default 0;
        localhost 1;
        127.0.0.1 1;
    }

    server {
        listen 8080 default_server;
        server_name localhost 127.0.0.1;
        root /usr/share/nginx/html;
        index index.html;

        # File limit plus 64 KiB multipart overhead; set from the same env as FastAPI.
        client_max_body_size __MAX_REQUEST_BYTES__;

        if ($local_host = 0) { return 400; }

        add_header X-Content-Type-Options nosniff always;

        location = /web-health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        location ~ ^/(auth(?:/|$)|files(?:/|$)|folders(?:/|$)|public(?:/|$)|homes(?:/|$)|health$|db-health$|docs(?:/|$)|redoc$|openapi\.json$) {
            # Resolve on requests so API container replacement does not leave a stale IP.
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Keep the browser's hostname AND port for FastAPI's same-origin protection.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
        }

        location ~ (^|/)\. {
            return 404;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff always;
        }
    }
}
